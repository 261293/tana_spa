<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
    <title>Jade Bathhouse - Day Spa</title>
    <meta name="description" content="Book massages, facials and body treatments at Jade Bathhouse Day Spa."/>
    <meta name="theme-color" content="#F7FFF6"/>
    <meta name="color-scheme" content="light"/>
    <!-- Inline so the browser has an icon without a second request; the house mark, in moss. -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23117034' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M4 20C4 10 10 4 20 4c0 10-6 16-16 16z'/%3E%3Cpath d='M4.5 19.5 13.5 10.5'/%3E%3C/svg%3E"/>
    <link type="text/css" rel="stylesheet" href="styles.css">

    <!-- Web Push, off until a Firebase project is configured. Uncomment, fill in the values from
         "Project settings -> General -> Your apps -> Web app", paste the Web Push certificate key
         pair into TANA_PUSH_VAPID_KEY, and put the same config in firebase-messaging-sw.js.
         None of these values is a secret; they identify the project to the browser.
         The app checks for the SDK at runtime, so leaving this commented out simply means no push.
         Steps and the server side: docs/notifications.md. -->
    <!--
    <script src="https://www.gstatic.com/firebasejs/13.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/13.0.0/firebase-messaging-compat.js"></script>
    <script>
        firebase.initializeApp({
            apiKey: "REPLACE_ME",
            authDomain: "REPLACE_ME.firebaseapp.com",
            projectId: "REPLACE_ME",
            messagingSenderId: "REPLACE_ME",
            appId: "REPLACE_ME"
        });
        window.TANA_PUSH_VAPID_KEY = "REPLACE_ME";
    </script>
    -->

    <!-- Backend for the browser build. Left unset the app falls back to http://localhost:8081,
         which is right for wasmJsBrowserDevelopmentRun but wrong for a deployed site. Set it to
         the API origin with no trailing slash, and add that same origin to the server's
         CORS_ALLOWED_ORIGINS or the browser will refuse every response. -->
    <!--
    <script>window.TANA_API_BASE_URL = "https://REPLACE_ME";</script>
    -->

    <script type="application/javascript" src="composeApp.js"></script>
</head>
<body>
<!-- Shown until Compose attaches its canvas (see styles.css); a blank page for the seconds a
     wasm binary takes to arrive reads as a broken site. -->
<div id="loading" role="status">Loading Jade Bathhouse...</div>
</body>
</html>
