# Daemon JVM criteria. The daemon also compiles (no jvmToolchain is configured anywhere), so
# pinning the language version keeps bytecode consistent across machines and CI.
#
# Deliberately no toolchainVendor and no toolchainUrl entries: any Java 21 distribution works,
# and Gradle uses the JVM that launched it. The generated foojay toolchainUrl list that used to
# live here had gone stale (HTTP 400), which turned "no local Java 21" into a confusing download
# error. Without those URLs, Gradle instead reports that no matching toolchain was found.
#
# Auto-provisioning is not available: org.gradle.java.installations.auto-detect=false in
# gradle.properties, and no toolchain download repository is configured in settings.gradle.kts.
# So every build environment must supply Java 21 itself (CI: actions/setup-java, see ci.yml).
toolchainVersion=21
