title = "tana_spa secret scanning"

[extend]
# Start from gitleaks' maintained ruleset (cloud keys, tokens, private keys, ...).
useDefault = true

# Keep allowlists NARROW: every entry must say what it hides and why it is safe.
# `condition = "AND"` means both the path and the value must match, so a real secret that
# happens to be committed to the same file is still reported.
[[allowlists]]
description = "A documented 'BAD example' (hardcoded credentials) with an obviously fake key in an agent skill reference"
condition = "AND"
paths = ['''\.claude/skills/code-reviewer/references/common_antipatterns\.md''']
regexes = ['''sk-abc123xyz789''']

# The seeded local-admin password. Deliberately public so the /admin portal opens with no setup
# on any fresh database (see docs/feature-flags.md); it is not a credential for any real system,
# and the seeder's own comment says to change or delete those accounts before exposing a server.
[[allowlists]]
description = "Deliberately published dev password for the two seeded /admin accounts"
condition = "AND"
paths = [
    '''server/src/main/kotlin/com/tana/spa/auth/AdminSeeder\.kt''',
    '''docs/feature-flags\.md''',
    '''docs/local-development\.md''',
]
regexes = ['''P@ssw0rd26''']
